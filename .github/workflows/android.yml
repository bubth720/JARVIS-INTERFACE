name: Android
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install supported Android SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '11076708'
          # Override the obsolete default "tools platform-tools" completely.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify UI scope and pinned CORE test source
        run: python3 scripts/check_ui01_scope.py
      - name: Verify synthetic layered avatar assets
        run: python3 scripts/check_avatar_assets.py
      - name: Build APK, run JVM tests and Lint, compile instrumented APK
        run: ./scripts/check.sh --no-daemon
      - name: Verify CORE reference is not packaged
        run: python3 scripts/check_ui01_scope.py --apk
      - name: Verify APKs and executed JVM tests
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'Missing JVM test reports'
          counts = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          for report in reports:
              root = ET.parse(report).getroot()
              for key in counts:
                  counts[key] += int(root.attrib.get(key, 0))
          assert counts['tests'] > 0, 'No JVM tests executed'
          assert all(counts[k] == 0 for k in ('failures', 'errors', 'skipped')), counts
          summary = f"JVM tests: {counts}. Both APKs present. Instrumented tests compiled, not executed.\n"
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          PY
      - name: Prepare physical-device validation kit
        run: python3 scripts/package_device_kit.py
      - name: Upload physical-device validation kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-interface-device-kit
          if-no-files-found: error
          path: app/build/device-kit/
      - name: Prepare avatar prototype kit
        run: python3 scripts/package_device_kit.py --avatar
      - name: Upload avatar prototype kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-interface-avatar-kit
          if-no-files-found: error
          path: app/build/avatar-kit/
      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-interface-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-validation-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
