name: M51 isolated cockpit and Android evidence
on:
  push:
    branches: ['codex/m51-v1-foundation', 'codex/m51-r1-android-stability']
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  build:
    if: github.ref == 'refs/heads/codex/m51-v1-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Frozen historical sources and measurement validation
        run: |
          python3 m51/check.py
          python3 -m unittest discover -s m51 -p 'test_*.py' -v
      - name: Build same-source comparison and laboratory APKs
        run: |
          ./gradlew --no-daemon -I m51/lab.init.gradle :app:testDebugUnitTest :m51lab:testBaselineDebugUnitTest :m51lab:testCandidateDebugUnitTest :m51lab:assembleBaselineDebug :m51lab:assembleCandidateDebug :m51lab:assembleBaselineDebugAndroidTest :m51lab:assembleCandidateDebugAndroidTest :m51lab:lintCandidateDebug
          python3 m51/collect_build.py
          python3 m51/check.py
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: M51-build-${{ github.sha }}
          retention-days: 90
          path: |
            build/m51-delivery/
            build/m51-reports/
            m51/android-lab/build/reports/lint-results-candidateDebug.*
            m51/android-lab/build/test-results/
            app/build/test-results/
  device:
    if: github.ref == 'refs/heads/codex/m51-v1-foundation'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            profile: generic-phone
            size: 1080x1920
            density: 420
          - api: 35
            profile: generic-tablet
            size: 1200x1920
            density: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read-only host capability, no repeated unsupported boot
        id: host
        run: python3 m51/host_capability.py
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: M51-build-${{ github.sha }}
          path: build/download
      - name: Locate exact APK receipt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          matches=list(Path('build/download').rglob('build.json'))
          assert len(matches)==1
          source=matches[0].parent
          target=Path('build/m51-delivery');target.mkdir(parents=True)
          for p in source.iterdir():
              if p.is_file():shutil.copy2(p,target/p.name)
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.host.outputs.ready == 'true' || steps.host.outputs.software == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Functional UI and controlled frame windows, actual emulator only
        if: steps.host.outputs.ready == 'true' || steps.host.outputs.software == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-linux-hw-accel: ${{ steps.host.outputs.ready == 'true' && 'false' || 'true' }}
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 m51/device_campaign.py --delivery build/m51-delivery --output build/m51-device --api ${{ matrix.api }} --profile ${{ matrix.profile }} --size ${{ matrix.size }} --density ${{ matrix.density }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: M51-device-${{ matrix.api }}-${{ matrix.profile }}-${{ github.sha }}
          path: |
            build/m51-host/
            build/m51-device/
          retention-days: 90
          if-no-files-found: error

  r1_build:
    outputs:
      campaign: ${{ steps.campaign.outputs.mode }}
    if: github.ref == 'refs/heads/codex/m51-r1-android-stability'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: campaign
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import json,os
          p=Path('m51/r1/CAMPAIGN.json')
          mode=json.loads(p.read_text())['mode'] if p.exists() else 'D1'
          assert mode in ['D1','Q1']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('mode='+mode+'\n')
          PYTHON
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          python3 m51/check.py
          python3 m51/r1/check.py
          python3 -m unittest discover -s m51 -p 'test_*.py' -v
          ./gradlew --no-daemon -I m51/lab.init.gradle -Pm51R1=true :app:testDebugUnitTest :m51lab:testBaselineDebugUnitTest :m51lab:testCandidateDebugUnitTest :m51lab:assembleBaselineDebug :m51lab:assembleCandidateDebug :m51lab:assembleBaselineDebugAndroidTest :m51lab:assembleCandidateDebugAndroidTest :m51lab:lintCandidateDebug
          python3 m51/collect_build.py
          cp m51/android-lab/build/generated/r1-tests/receipt.json build/m51-r1/test-staging.json
          python3 m51/r1/check.py
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: M51-R1-build-${{ github.sha }}
          path: |
            build/m51-delivery/
            build/m51-r1/
            build/m51-reports/
            m51/android-lab/build/test-results/
            m51/android-lab/build/reports/lint-results-candidateDebug.*
            app/build/test-results/
          retention-days: 90
  r1_diagnostic:
    if: github.ref == 'refs/heads/codex/m51-r1-android-stability' && needs.r1_build.outputs.campaign == 'D1'
    needs: r1_build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: M51-R1-build-${{ github.sha }}
          path: build/download
      - name: Receive exact source APKs and inspect current host rights
        run: |
          python3 m51/host_capability.py
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          matches=list(Path('build/download').rglob('build.json'));assert len(matches)==1
          target=Path('build/m51-delivery');target.mkdir(parents=True)
          for p in matches[0].parent.iterdir():
              if p.is_file():shutil.copy2(p,target/p.name)
          PYTHON
      - name: One boot, System UI first, isolated failures only
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-linux-hw-accel: true
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 -m m51.r1.diagnose --api ${{ matrix.api }} --delivery build/m51-delivery --out build/m51-r1-device
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: M51-R1-D1-api${{ matrix.api }}-${{ github.sha }}
          path: |
            build/m51-host/
            build/m51-r1-device/
          retention-days: 90
  r1_intel_host_probe:
    needs: r1_build
    if: github.ref == 'refs/heads/codex/m51-r1-android-stability' && needs.r1_build.outputs.campaign == 'D1'
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: emulator platform-tools
          log-accepted-android-sdk-licenses: false
      - run: python3 m51/r1/host_probe.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: M51-R1-Intel-host-${{ github.sha }}
          path: build/m51-r1-host/
          retention-days: 90

  r1_qualification:
    if: github.ref == 'refs/heads/codex/m51-r1-android-stability' && needs.r1_build.outputs.campaign == 'Q1'
    needs: r1_build
    runs-on: macos-15-intel
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: emulator platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: M51-R1-build-${{ github.sha }}
          path: build/download
      - name: Verify current Intel hypervisor and receive exact APKs
        id: accelerator
        run: |
          python3 m51/r1/host_probe.py
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          m=list(Path('build/download').rglob('build.json'));assert len(m)==1
          t=Path('build/m51-delivery');t.mkdir(parents=True)
          for p in m[0].parent.iterdir():
              if p.is_file():shutil.copy2(p,t/p.name)
          PYTHON
      - name: One accelerated boot, system preflight and progressive qualification
        if: steps.accelerator.outputs.ready == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 -m m51.r1.qualification --api ${{ matrix.api }} --delivery build/m51-delivery --out build/m51-r1-q
      - name: An unavailable accelerator cannot qualify Android
        if: steps.accelerator.outputs.ready != 'true'
        run: python3 -c "raise SystemExit('BLOCKED_ACCELERATOR_NO_BOOT')"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: M51-R1-Q1-api${{ matrix.api }}-${{ github.sha }}
          path: |
            build/m51-r1-host/
            build/m51-r1-q/
          retention-days: 90
