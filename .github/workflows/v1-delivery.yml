name: JARVIS V1 delivery (voice conversation, fully local)
on:
  push:
    branches: ['codex/jarvis-v1-delivery']
    paths: ['.github/workflows/v1-delivery.yml', 'labs/v1/**']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: v1-delivery-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: interface, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: bubth720/JAVIS-Local-v2, ref: 5da98383ed12cb5a54e896fbe57560bacc432fb5, path: core, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: bubth720/JARVIS-LLM, ref: 2e011776d9e0f675bcae49b739f12a3a6dbf4de4, path: llm, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: bubth720/JARVIS-VOICE, ref: 92d07453260553466c92196454b56929b7494b2f, path: voice, persist-credentials: false}
      - name: Guards (scope chain M55-D → V1-B → V1-A → M50), byte-identical reuse, exact sources
        run: |
          mkdir -p "$RUNNER_TEMP/v1"
          git -C interface config user.email ci@invalid && git -C interface config user.name ci
          python3 interface/labs/v1/tools/check_scope.py --interface interface | tee "$RUNNER_TEMP/v1/scope.log"
          python3 interface/labs/v1/tools/check_reuse.py --voice voice | tee "$RUNNER_TEMP/v1/reuse.log"
          python3 interface/labs/v1/tools/prepare_sources.py --core core --interface interface --llm llm --output "$RUNNER_TEMP/v1-sources"
      - name: Pinned native sources (llama.cpp for A02, whisper.cpp v1.8.4 for STT)
        run: |
          llm/tools/prepare-native.sh
          interface/labs/v1/tools/prepare_whisper.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.1.13356709 cmake;3.22.1'
      - name: Build APK + test APK, unit tests, Lint
        run: |
          gradle -p interface/labs/v1 -PlabSources="$RUNNER_TEMP/v1-sources/kotlin" -Pa02Root="$GITHUB_WORKSPACE/llm" -PvoiceRoot="$GITHUB_WORKSPACE/voice" \
            -Pv1Abis=arm64-v8a,x86_64 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon --max-workers=2 --console=plain
      - name: Inspect the APK (permissions, engines, nothing bundled, alignment)
        run: |
          apk=interface/labs/v1/app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"; ndk="$ANDROID_HOME/ndk/28.1.13356709/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$bt/aapt" dump permissions "$apk" | tee "$RUNNER_TEMP/v1/permissions.txt"
          test "$(grep -c "uses-permission: name='android.permission" "$RUNNER_TEMP/v1/permissions.txt")" = 1
          grep -q "uses-permission: name='android.permission.RECORD_AUDIO'" "$RUNNER_TEMP/v1/permissions.txt"
          ! grep -q "INTERNET" "$RUNNER_TEMP/v1/permissions.txt"
          unzip -l "$apk" | tee "$RUNNER_TEMP/v1/apk-content.txt" | grep -E "lib/arm64-v8a/.*\.so" 
          for lib in libjarvis_llm_a02.so libjarvis_stt.so libonnxruntime.so; do grep -q "lib/arm64-v8a/$lib" "$RUNNER_TEMP/v1/apk-content.txt"; done
          ! grep -Ei "\.gguf|\.onnx|ggml-.*\.bin|voices\.bin" "$RUNNER_TEMP/v1/apk-content.txt"
          mkdir -p "$RUNNER_TEMP/v1/so" && unzip -o -q "$apk" 'lib/arm64-v8a/libjarvis_*' -d "$RUNNER_TEMP/v1/so"
          for so in "$RUNNER_TEMP"/v1/so/lib/arm64-v8a/*.so; do "$ndk/llvm-readelf" -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tee -a "$RUNNER_TEMP/v1/align.txt"; done
          ! grep -v 0x4000 "$RUNNER_TEMP/v1/align.txt"
          "$ndk/llvm-nm" -D --defined-only "$RUNNER_TEMP/v1/so/lib/arm64-v8a/libjarvis_stt.so" | awk '{print $3}' | tee "$RUNNER_TEMP/v1/stt-exports.txt"
          ! grep -v '^Java_fr_jarvis_v1_stt_' "$RUNNER_TEMP/v1/stt-exports.txt"
          sha256sum "$apk" | tee "$RUNNER_TEMP/v1/apk-sha256.txt"
      - name: Local resources (exact revisions + SHA-256; never bundled) and French test utterances
        run: |
          r="$RUNNER_TEMP/v1-res"; mkdir -p "$r"
          get() { curl --fail --location --retry 2 "$1" -o "$2"; test "$(stat -c %s "$2")" = "$3"; echo "$4  $2" | sha256sum -c -; }
          get https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/50968a4468ef4233ed78cd7c3de230dd1d61a56b/Qwen3-0.6B-Q4_K_M.gguf "$r/llm.gguf" 396705472 ac2d97712095a558e31573f62f466a3f9d93990898b0ec79d7c974c1780d524a
          get https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q5_1.bin "$r/stt.bin" 59707625 422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898
          python3 voice/scripts/pocket/prepare_model.py --work-dir "$RUNNER_TEMP/pocket-work" --output "$r/tts.zip"
          sudo apt-get install -y -q espeak-ng >/dev/null
          espeak-ng -v fr -s 135 -w "$r/u1.wav" "Bonjour, je m'appelle Thomas."
          espeak-ng -v fr -s 135 -w "$r/u2.wav" "Comment je m'appelle ?"
          for i in 1 2; do ffmpeg -loglevel error -y -i "$r/u$i.wav" -af "adelay=300,apad=pad_dur=1" -ar 16000 -ac 1 -sample_fmt s16 "$r/utt$i.wav"; done
          ls -l "$r" | tee "$RUNNER_TEMP/v1/resources.txt"; sha256sum "$r"/tts.zip "$r"/utt*.wav | tee -a "$RUNNER_TEMP/v1/resources.txt"
      - name: Enable emulator acceleration and a virtual microphone (PulseAudio, best effort)
        run: |
          test -e /dev/kvm && sudo chmod a+rw /dev/kvm
          (sudo apt-get install -y -q pulseaudio pulseaudio-utils >/dev/null && pulseaudio -D --exit-idle-time=-1 && sleep 1 \
            && pactl load-module module-null-sink sink_name=vspk && pactl load-module module-virtual-source source_name=vmic master=vspk.monitor \
            && pactl set-default-source vmic && pactl info | tee "$RUNNER_TEMP/v1/pulseaudio.txt") || echo "PULSEAUDIO_UNAVAILABLE" | tee "$RUNNER_TEMP/v1/pulseaudio.txt"
      - name: API29 — real voice conversation (airplane mode)
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env: {QEMU_AUDIO_DRV: pa}
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          ram-size: 6144M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -allow-host-audio
          script: bash interface/labs/v1/tools/run_emulator.sh 29 "$RUNNER_TEMP/v1-res" "$RUNNER_TEMP/v1/api29"
      - name: API35 — real voice conversation (airplane mode)
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env: {QEMU_AUDIO_DRV: pa}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 6144M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -allow-host-audio
          script: bash interface/labs/v1/tools/run_emulator.sh 35 "$RUNNER_TEMP/v1-res" "$RUNNER_TEMP/v1/api35"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1-evidence-${{ github.sha }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/v1/
            interface/labs/v1/app/build/reports/
            interface/labs/v1/app/build/test-results/
      - name: Publish JARVIS V1 APK (testOnly; resources NOT bundled)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JARVIS-V1-APK-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            interface/labs/v1/app/build/outputs/apk/debug/app-debug.apk
            interface/labs/v1/INSTALL.md
            interface/labs/v1/resources.json
            ${{ runner.temp }}/v1/apk-sha256.txt
      - name: Delivery summary
        if: always()
        run: |
          echo "APK SHA-256: $(cut -d' ' -f1 "$RUNNER_TEMP/v1/apk-sha256.txt" 2>/dev/null || echo NOT_PRODUCED)"
          cat "$RUNNER_TEMP/v1/pulseaudio.txt" 2>/dev/null | head -5 || true
          for api in 29 35; do
            echo "### API $api end-to-end"; cat "$RUNNER_TEMP/v1/api$api/v1-report.json" 2>/dev/null || echo NOT_RUN_OR_FAILED
            echo "### API $api microphone"; cat "$RUNNER_TEMP/v1/api$api/v1-mic.json" 2>/dev/null || echo NOT_RUN_OR_FAILED
            grep -E "^OK|FAILURES|Tests run" "$RUNNER_TEMP/v1/api$api/instrumentation-mic.txt" 2>/dev/null || true
          done
