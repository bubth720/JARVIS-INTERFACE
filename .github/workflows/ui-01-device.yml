name: UI-01 emulator evidence
on:
  pull_request:
    branches: [development/mission-002]
  push:
    branches: [feat/ui-01-native-cockpit]
concurrency:
  group: ui-01-device-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: generic-phone
            size: 1080x2400
            density: 420
          - profile: generic-tablet
            size: 1200x1920
            density: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM for test runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test native application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p evidence
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew connectedDebugAndroidTest --no-daemon
            adb shell am force-stop com.jarvis.interfaceapp
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb shell am start -W -n com.jarvis.interfaceapp/.MainActivity
            sleep 3
            adb exec-out screencap -p > evidence/portrait.png
            adb shell settings put system user_rotation 1
            sleep 3
            adb exec-out screencap -p > evidence/landscape.png
            adb shell dumpsys meminfo com.jarvis.interfaceapp > evidence/memory.txt
            adb shell dumpsys gfxinfo com.jarvis.interfaceapp > evidence/frames.txt
            adb shell dumpsys cpuinfo > evidence/cpu-snapshot.txt
            adb shell dumpsys battery > evidence/battery-snapshot.txt
            adb logcat -d -b crash > evidence/crashes.txt
            adb shell getprop ro.product.model > evidence/emulator-model.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-01-${{ matrix.profile }}
          path: |
            evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
