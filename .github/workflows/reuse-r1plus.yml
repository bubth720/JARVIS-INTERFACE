name: REUSE R1+ isolated Android preparation and C1
on:
  push:
    branches: [codex/reuse-first-r1plus-20261108, codex/reuse-first-r1plus-c1-android, codex/m55-a-p4-r1plus-kvm-diagnostic]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preserve exact R1 and run existing and new diagnostic tests
        run: |
          python3 m51/reuse_r1plus/check.py
          python3 -m unittest discover -s m51 -p 'test_*.py' -v
          git clone --shared . build/replay-r1
          git -C build/replay-r1 checkout --detach b9a9506785b8851f55789ed4329c9394a3937447
          (cd build/replay-r1 && python3 m51/check.py && python3 m51/r1/check.py)
      - name: Reuse unchanged application sources and opt-in R1 test staging
        run: |
          ./gradlew --no-daemon -I m51/lab.init.gradle -Pm51R1=true :app:testDebugUnitTest :m51lab:testBaselineDebugUnitTest :m51lab:testCandidateDebugUnitTest :m51lab:assembleBaselineDebug :m51lab:assembleCandidateDebug :m51lab:assembleBaselineDebugAndroidTest :m51lab:assembleCandidateDebugAndroidTest :m51lab:lintCandidateDebug
          python3 m51/collect_build.py
          python3 m51/reuse_r1plus/check.py
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: REUSE-R1plus-build-${{ github.sha }}
          retention-days: 90
          path: |
            build/m51-delivery/
            build/reuse-r1plus/
            build/m51-reports/
            m51/android-lab/build/test-results/
            m51/android-lab/build/reports/lint-results-candidateDebug.*
            app/build/test-results/
  linux_probe:
    if: github.ref == 'refs/heads/codex/reuse-first-r1plus-c1-android'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.accelerator.outputs.ready }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: emulator platform-tools, log-accepted-android-sdk-licenses: false}
      - id: accelerator
        run: python3 -m m51.reuse_r1plus.host_probe
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: REUSE-R1plus-linux-probe-${{ github.sha }}
          path: build/m51-r1-host/
          retention-days: 90
  device:
    if: github.ref == 'refs/heads/codex/reuse-first-r1plus-c1-android'
    needs: [build, linux_probe]
    runs-on: ${{ needs.linux_probe.outputs.ready == 'true' && 'ubuntu-24.04' || 'macos-15-intel' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: emulator platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: REUSE-R1plus-build-${{ github.sha }}
          path: build/download
      - name: Receive exact build without changing historical installations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          matches=list(Path('build/download').rglob('build.json'));assert len(matches)==1
          target=Path('build/m51-delivery');target.mkdir(parents=True)
          for p in matches[0].parent.iterdir():
              if p.is_file():shutil.copy2(p,target/p.name)
          PY
      - id: accelerator
        run: python3 -m m51.reuse_r1plus.host_probe
      - name: One accelerated boot, no retry, no host permission modification
        id: android
        if: steps.accelerator.outputs.ready == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -timezone Etc/UTC
          script: python3 -m m51.r1.qualification --campaign REUSE-R1PLUS-C1 --run-id ${{ github.run_id }} --api ${{ matrix.api }} --delivery build/m51-delivery --out build/reuse-r1plus-device
      - name: Unavailable acceleration remains blocked
        if: steps.accelerator.outputs.ready != 'true'
        run: python3 -c "raise SystemExit('BLOCKED_ACCELERATOR_NO_BOOT')"
      - name: Preserve evidence even after boot or preflight failure
        if: always()
        env:
          ANDROID_STEP_OUTCOME: ${{ steps.android.outcome }}
        run: python3 -m m51.reuse_r1plus.collect --api ${{ matrix.api }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: REUSE-R1plus-C1-api${{ matrix.api }}-${{ github.sha }}
          retention-days: 90
          path: |
            build/m51-r1-host/
            build/reuse-r1plus-device/
  # M55-A P4 (owner-authorized 2026-11-12): the C1 campaign never booted on Linux because the probe
  # refused to grant access to /dev/kvm, so it fell back to Intel/HVF where system ANRs appeared.
  # This job runs the UNCHANGED R1 diagnostic (m51/r1/diagnose.py, strict C1 preflight) once per API on
  # ubuntu-24.04 with KVM access granted to the ephemeral CI runner only (CI infrastructure, not an
  # application protection). One boot, no retry, same emulator parameters as C1. It collects the
  # picker.jsonl SAF witness that Q1/C1 never retrieved. No application source or historical test changes.
  m55_kvm_diagnostic:
    if: github.ref == 'refs/heads/codex/m55-a-p4-r1plus-kvm-diagnostic'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: emulator platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: REUSE-R1plus-build-${{ github.sha }}
          path: build/download
      - name: Receive exact build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          matches=list(Path('build/download').rglob('build.json'));assert len(matches)==1
          target=Path('build/m51-delivery');target.mkdir(parents=True)
          for p in matches[0].parent.iterdir():
              if p.is_file():shutil.copy2(p,target/p.name)
          PY
      - name: Grant KVM to the ephemeral CI runner (documented M55-A P4 deviation from the read-only probe)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - id: accelerator
        run: python3 -m m51.reuse_r1plus.host_probe --out build/m55-p4-host
      - name: One KVM boot, no retry, unchanged R1 diagnostic with strict C1 preflight
        id: android
        if: steps.accelerator.outputs.ready == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -timezone Etc/UTC
          script: python3 -m m51.r1.diagnose --campaign REUSE-R1PLUS-C1 --run-id ${{ github.run_id }} --api ${{ matrix.api }} --delivery build/m51-delivery --out build/m55-p4-device
      - name: Accelerator still unavailable
        if: steps.accelerator.outputs.ready != 'true'
        run: python3 -c "raise SystemExit('BLOCKED_ACCELERATOR_NO_BOOT')"
      - name: Diagnostic summary (printed for traceability)
        if: always()
        run: |
          cat build/m55-p4-host/host.json 2>/dev/null || echo NO_HOST_REPORT
          cat build/m55-p4-device/diagnostic.json 2>/dev/null || echo NO_DIAGNOSTIC_REPORT
          for f in build/m55-p4-device/*picker.jsonl; do [ -f "$f" ] && { echo "== $f"; head -c 6000 "$f"; echo; }; done
          for f in build/m55-p4-device/*-instrumentation.txt; do [ -f "$f" ] && { echo "== $f"; tail -n 40 "$f"; }; done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: M55-P4-kvm-diagnostic-api${{ matrix.api }}-${{ github.sha }}
          retention-days: 90
          path: |
            build/m55-p4-host/
            build/m55-p4-device/
